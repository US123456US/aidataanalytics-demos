version: '3.8'
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    environment:
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=tsuser
      - POSTGRES_DB=timeseriesdb
    ports:
      - '5432:5432'
    volumes:
      - timescale_data:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana:9.0.0
    ports:
      - '3000:3000'
    volumes:
      - grafana_data:/var/lib/grafana

  backend:
    image: python:3.10-slim
    volumes:
      - ./:/app
    working_dir: /app
    command: ["sh", "-c", "pip install psycopg2-binary prophet pandas && python timeseries_ingest_and_analyze.py"]
    depends_on:
      - timescaledb

volumes:
  timescale_data:
  grafana_data:
